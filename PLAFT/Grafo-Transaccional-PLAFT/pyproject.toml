[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-plaft"
version = "0.1.0"
description = "Plataforma Analítica PLAFT basada en Grafos — MVP"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "pyarrow>=16.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "mlflow>=2.14",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "boto3-stubs[s3,sagemaker]>=1.34",
]
spark = [
    # PySpark se provee desde el entorno SageMaker; solo para desarrollo local
    "pyspark>=3.5",
]

[project.scripts]
graph-plaft = "graph_plaft.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# ruff — linter y formateador
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (seguridad básica)
    "T20", # flake8-print
]
ignore = [
    "S101", # uso de assert en tests
    "B008", # no call in defaults (usado por Click/Typer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — verificación estática de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyspark.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest — configuración de pruebas
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "unit: prueba unitaria (sin I/O externo)",
    "integration: prueba de integración (requiere filesystem o servicios locales)",
    "contract: prueba de contrato de datos",
    "performance: prueba de rendimiento (excluida por defecto)",
    "aws: requiere acceso a AWS (excluida en CI local)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "jobs/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
